name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go-native:
    name: Go root and all parser modules
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.0
      - name: Install pinned TypeScript reference compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/zp-typescript" --no-save --ignore-scripts typescript@5.9.3
          echo "$RUNNER_TEMP/zp-typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
          ref: v5.9.3
          path: typescript-reference
          sparse-checkout: tests/cases
          sparse-checkout-cone-mode: true
      - name: Verify required runtimes and references
        env:
          REQUIRE_NODE: "1"
          REQUIRE_PYTHON: "1"
          REQUIRE_TSC: "1"
          REQUIRE_TYPESCRIPT_CORPUS: "1"
          ZP_PYTHON: python
          ZP_TYPESCRIPT: ${{ runner.temp }}/zp-typescript/node_modules/typescript
          ZP_TYPESCRIPT_TESTS: ${{ github.workspace }}/typescript-reference/tests/cases
        run: .github/scripts/require-toolchain.sh
      - name: Record test provenance
        env:
          ZP_PYTHON: python
          ZP_TYPESCRIPT: ${{ runner.temp }}/zp-typescript/node_modules/typescript
          ZP_TYPESCRIPT_REF: ${{ github.workspace }}/typescript-reference
          ZP_TYPESCRIPT_TESTS: ${{ github.workspace }}/typescript-reference/tests/cases
        run: .github/scripts/write-provenance.sh "$RUNNER_TEMP/zp-ci-provenance.log"
      - name: Test root module
        run: go test -v -timeout=45m ./... 2>&1 | tee "$RUNNER_TEMP/zp-root-test.log"
      - name: Vet root module
        run: go vet ./... 2>&1 | tee "$RUNNER_TEMP/zp-root-vet.log"
      - name: Test and vet parsers plus every parser module
        env:
          ZP_PYTHON: python
          ZP_TYPESCRIPT: ${{ runner.temp }}/zp-typescript/node_modules/typescript
          ZP_TYPESCRIPT_TESTS: ${{ github.workspace }}/typescript-reference/tests/cases
        run: parsers/test.sh -v -timeout=30m 2>&1 | tee "$RUNNER_TEMP/zp-parser-modules.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-native-test-logs
          path: ${{ runner.temp }}/zp-*.log
          if-no-files-found: ignore
          retention-days: 14

  site:
    name: Site build and JavaScript checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Require Node.js used by site tests
        env:
          REQUIRE_NODE: "1"
        run: .github/scripts/require-toolchain.sh
      - name: Record test provenance
        run: .github/scripts/write-provenance.sh "$RUNNER_TEMP/zp-ci-provenance.log"
      - name: Test site module
        run: cd site && go test -v -timeout=45m ./... 2>&1 | tee "$RUNNER_TEMP/zp-site-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-test-logs
          path: |
            ${{ runner.temp }}/zp-site-test.log
            ${{ runner.temp }}/zp-ci-provenance.log
          if-no-files-found: ignore
          retention-days: 14

  node-wasm-typescript:
    name: Node.js WASM and generated TypeScript
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install pinned TypeScript checker
        run: npm install --global --ignore-scripts typescript@5.9.3
      - name: Require Node.js and TypeScript checker
        env:
          REQUIRE_NODE: "1"
          REQUIRE_TSC: "1"
        run: .github/scripts/require-toolchain.sh
      - name: Record test provenance
        run: ZP_TYPESCRIPT="$(npm root -g)/typescript" .github/scripts/write-provenance.sh "$RUNNER_TEMP/zp-ci-provenance.log"
      - name: Run WebAssembly smoke test in Node.js
        run: go test -v -timeout=20m ./cmd/playground -run '^TestWasmSmoke$' -count=1 2>&1 | tee "$RUNNER_TEMP/zp-wasm-test.log"
      - name: Run generated TypeScript parser tests and strict type checks
        run: go test -v -timeout=20m ./internal/gen ./internal/gen/tsgen -run '^TestGeneratedTS' -count=1 2>&1 | tee "$RUNNER_TEMP/zp-generated-ts-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-wasm-typescript-test-logs
          path: |
            ${{ runner.temp }}/zp-*-test.log
            ${{ runner.temp }}/zp-ci-provenance.log
          if-no-files-found: ignore
          retention-days: 14
