# Netlify configuration for the PEGO web site: the landing page, the documentation rendered from
# the repository's Markdown, the API reference and the playground. The build needs only Go; see
# docs/guide/playground.md and docs/design/records/016-web-site-and-playground.md.

[build]
  command = "sh site/build.sh"
  publish = "site/dist"

[build.environment]
  # The go directive of go.mod and site/go.mod.
  GO_VERSION = "1.27.1"

# Use the canonical domain even when the requested path names a published file.
[[redirects]]
  from = "https://pego-go.netlify.app/*"
  to = "https://pego.ornew.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://pego-go.netlify.app/*"
  to = "https://pego.ornew.net/:splat"
  status = 301
  force = true

# The design records moved to /docs/design/records/. A rule without force applies only where no page
# exists at the requested path, so the pages that now live under /docs/design/ are not redirected.
[[redirects]]
  from = "/docs/design/:record"
  to = "/docs/design/records/:record"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    # 'wasm-unsafe-eval' lets the playground compile pego.wasm; nothing else is loaded from
    # elsewhere or run inline.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The WebAssembly binary is named after a hash of its content (site/build.go), so a name never refers
# to other content and browsers can keep it for a year without asking again. Matching runtime scripts
# are content-hashed too; pages, application scripts and assets.json revalidate on each visit.
[[headers]]
  for = "/playground/wasm/*"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/playground/runtime/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
